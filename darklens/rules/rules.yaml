# DarkLens detection rules. Original work, released under the MIT licence (same as the project).
# Each rule fires when ANY pattern matches (case-insensitive regex). `weight` is the strength of the
# signal on its own (0-100). Signals from many rules are combined with noisy-OR in darklens/scoring.py.

- id: DL-RAN-001
  category: ransomware_leak
  name: Leak countdown
  weight: 70
  why: Extortion sites publish a deadline before releasing stolen data.
  patterns: ['\b(data|files?) will be (published|released|leaked)\b', '\bcountdown\b', '\bdeadline\b.{0,40}\b(days?|hours?)\b', '\btime left\b', '\bpublication in \d+ (days?|hours?)\b', '\bleak scheduled\b', '\bscheduled (for|to be) (publication|published|release|released)\b', '\bdeadline:\s*\d{4}-\d{2}-\d{2}']
- id: DL-RAN-002
  category: ransomware_leak
  name: Victim claim with data volume
  weight: 80
  why: A named victim plus an amount of stolen data is the typical shape of a leak-site entry.
  patterns: ['\b\d+(\.\d+)?\s?(gb|tb|mb)\b.{0,60}\b(stolen|exfiltrat|download|data|leak)', '\b(stolen|exfiltrated)\b.{0,40}\b\d+(\.\d+)?\s?(gb|tb)\b']
- id: DL-RAN-003
  category: ransomware_leak
  name: Ransom negotiation language
  weight: 65
  why: Phrases about paying, decrypting or negotiating point to an active extortion case.
  patterns: ['\bransom\b', '\bdecrypt(ion|or)?\b', '\bnegotiat', '\bpay (us|the)\b', '\bchat with (us|support)\b']
- id: DL-RAN-004
  category: ransomware_leak
  name: Double extortion
  weight: 75
  why: Threatening to publish data as well as keep files encrypted is double extortion.
  patterns: ['\bdouble extortion\b', '\bencrypted and (stolen|exfiltrated)\b', '\bpublish(ed)? (your|the) data\b']
- id: DL-RAN-005
  category: ransomware_leak
  name: Ransomware affiliate recruiting
  weight: 60
  why: Ransomware-as-a-service operators advertise revenue splits to affiliates.
  patterns: ['\baffiliate (program|panel|wanted)\b', '\b\d{2}\s?/\s?\d{2}\s?(split|revenue)\b', '\braas\b', '\bransomware[- ]as[- ]a[- ]service\b']

- id: DL-RAN-006
  category: ransomware_leak
  name: Extortion group claim
  weight: 65
  why: An extortion or ransomware group claiming a victim, or its leak-site activity, is the shape of a leak-site entry.
  patterns:
    - '\b(extortion|ransomware) (group|gang|crew)\b'
    - '\bclaims? (the )?(theft|to have (stolen|breached|hacked))\b.{0,60}\b(records|data|customers|files)\b'
    - '\bleak site\b'

- id: DL-CRD-001
  category: credential_dump
  name: Combolist format
  weight: 80
  why: Many email:password pairs in a row is the signature of a combolist.
  # Bounded and anchored at a word edge so a long run of characters cannot make the scan quadratic.
  patterns: ['(?<![\w.+-])(?:[\w.+-]{1,64}@[\w-]{1,63}\.[\w.]{1,190}:[^\s:]{4,}\s*){3,}']
- id: DL-CRD-002
  category: credential_dump
  name: Database dump wording
  weight: 70
  why: Sellers describe breaches by rows, tables and hash type.
  patterns: ['\b\d[\d,\.]*\s?(k|m|million)?\s?(rows|records|users|accounts)\b.{0,50}\b(leak|dump|database|breach|sale)', '\b(sql|db|database) dump\b', '\b(md5|bcrypt|sha1)\b.{0,30}\b(hash|hashed)\b']
- id: DL-CRD-003
  category: credential_dump
  name: Stealer logs
  weight: 80
  why: Infostealer logs hold session cookies and saved passwords from infected machines.
  patterns: ['\bstealer logs?\b', '\b(redline|raccoon|lumma|vidar|stealc)\b', '\bcookies?\b.{0,40}\b(logs?|bundle|cloud)\b']
- id: DL-CRD-004
  category: credential_dump
  name: Corporate target named
  weight: 60
  why: A leak tied to a named company or domain is directly actionable for that company.
  patterns: ['\b(employee|customer|corporate|admin) (credentials|logins|accounts)\b', '\bvpn (logins?|credentials)\b']
- id: DL-CRD-005
  category: credential_dump
  name: Database offered for sale
  weight: 70
  why: A post that offers a database or dump and mentions emails, passwords or user records is a data sale, even without sample lines.
  patterns:
    # "dump" alone is common in IT ("heap dump", "memory dump"), so those are excluded; "not selling" is excluded too.
    - '(?<!not )(?<!never )\b(selling|for sale|wts|offering|auction)\b.{0,60}\b(database|db|(?<!heap )(?<!memory )(?<!core )(?<!crash )(?<!thread )dump|leak(ed)?|combo ?lists?|breach)\b.{0,100}\b(emails?|passwords?|credentials|users|customers|accounts|records|rows|hashes|logins?)\b'
    - '\b(database|db|(?<!heap )(?<!memory )(?<!core )(?<!crash )(?<!thread )dump|combo ?lists?)\b.{0,100}\b(emails?|passwords?|credentials|hashes|logins?)\b.{0,100}(?<!not )(?<!never )\b(for sale|selling|wts|price|btc|xmr|escrow)\b'
    - '\b(database|db|(?<!heap )(?<!memory )(?<!core )(?<!crash )(?<!thread )dump|combo ?lists?)\b.{0,60}(?<!not )(?<!never )\b(for sale|selling|wts|offering)\b.{0,100}\b(emails?|passwords?|credentials|users|hashes|logins?)\b'
    - '\b(fresh|new|private|leaked|hacked|stolen) (database|db|(?<!heap )(?<!memory )(?<!core )(?<!crash )(?<!thread )dump|combo ?lists?)\b.{0,100}\b(emails?|passwords?|credentials|hashes|logins?)\b'
    - '\b(plain ?text|clear ?text) (passwords?|credentials)\b'
    - '\b\d[\d,\.]*\s?(k|m|million|thousand)?\s?(rows|records|users|accounts|emails)\b.{0,40}\b(with|containing|incl(uding)?)\b.{0,40}\b(emails?|passwords?|credentials|hashes|phone)\b'

- id: DL-CRD-006
  category: credential_dump
  name: Data breach reported
  weight: 55
  why: A report that personal, customer or employee data was stolen, leaked or put up for sale.
  patterns:
    - '\bdata breach\b'
    - '\b(personal|customer|employee|user|patient)s?[''’]? (data|information|records|details)\b.{0,80}\b(stolen|leaked|exposed|accessed|compromised|up for (sale|auction))'
    - '\b(stolen|leaked|exposed)\b.{0,40}\b(customer|employee|user|patient|personal) (data|information|records)\b'
    - '\ball users[''’]? data\b.{0,30}\bstolen'
    # Added after the first untouched test (17 Nov 2026): breach news is often phrased as "exposed" or "impacted".
    - '\b(customer|employee|staff|user|patient|personal)s?(,? and (customer|employee|staff|user)s?)? (data|information|records)\b.{0,60}\b(exposed|impacted|stolen|leaked)\b'
    - '\b(impacted|affected) by (a |the )?(third[- ]party )?(data )?breach\b'
    - '\bbreach notification\b'
    - '\b(card numbers?|cvvs?|payment card (data|details))\b.{0,100}\b(exposed|stolen|leaked)\b'

- id: DL-CRD-007
  category: credential_dump
  name: Site or service hacked, data taken
  weight: 55
  why: A site or service is reported as hacked or breached, with its accounts, records or data taken or published.
  # Written from the wording of real breach reports (the Have I Been Pwned write-ups added before 2025). Every pattern
  # is bounded so a long input cannot make it slow.
  patterns:
    - '\b(was|were|had been|has been|been|got)\s+(hacked|breached|compromised)\b.{0,160}\b(data|records?|accounts?|users?|members?|customers?|emails?|passwords?|credentials?|information|database|details)\b'
    - '\b(hacked|breached|compromised)\b.{0,120}\b(exposed|leaked|published|dumped|posted|released|stolen|obtained|sold|traded|disclosed|circulat\w+)\b'
    - '\b(data|database|records?|accounts?|credentials?|passwords?|email addresses|user details|backup)\b.{0,100}\b(appeared|posted|published|released|shared|circulating|circulated|dumped|listed|offered|put up|advertised)\b.{0,100}\b(hacking forum|dark ?web|marketplace|for sale|publicly|forum|telegram|paste)'
    - '\b(publicly|openly)\s+(exposed|accessible)\b.{0,80}\b(database|server|bucket|instance|elasticsearch|mongodb|backup|file)\b'
    - '\bcredential[- ]stuffing\s+(list|attack|dump)\b'
    - '\b(accounts?|records?|email addresses|user details|users|members|customers)\b.{0,60}\b(were|was|being)\s+(dumped|leaked|stolen|obtained|exposed|published|posted|disclosed)\b'

- id: DL-CRD-008
  category: credential_dump
  name: Breach with a ransom or pay-or-leak demand
  weight: 55
  why: A breach where the attackers demanded payment or threatened to publish the stolen data.
  patterns:
    - '\b(ransom|extortion|pay[- ]or[- ]leak)\b.{0,160}\b(data|records?|accounts?|users?|customers?|emails?|information|database)\b.{0,100}\b(leak\w*|publish\w*|post\w*|expos\w*|dump\w*)\b'
    - '\b(data|records?|accounts?|database)\b.{0,100}\b(leak\w*|publish\w*|post\w*|dump\w*)\b.{0,120}\b(ransom|extortion|refus\w+ to pay|not paid)\b'

- id: DL-EXP-001
  category: exploit_sale
  name: Zero-day or exploit for sale
  weight: 85
  why: Selling a working exploit is a high-impact supply-chain risk.
  # A bare "zero-day" is everyday security news (patch coverage), so the strong rule needs sale wording nearby.
  patterns:
    - '\b(0[- ]?day|zero[- ]day)\b.{0,80}\b(for sale|selling|sell|wts|price|buy|buyer|btc|xmr|escrow|\$ ?\d)'
    - '\b(for sale|selling|sell|wts|buy|buyer|offering)\b.{0,60}\b(0[- ]?day|zero[- ]day)\b'
    - '\bexploit\b.{0,40}\b(for sale|selling|price|btc|xmr)\b'
    - '\bpoc\b.{0,30}\b(sale|selling)\b'
    # The other word order: "looking to sell a working exploit for ...".
    - '\b(sell|selling|wts|offering)\s+(an? |the |my |our )?(working |private |public |fresh |new |weaponi[sz]ed |zero[- ]day |0[- ]?day )*(exploit|poc|exploit chain|rce|lpe)\b'
- id: DL-EXP-004
  category: exploit_sale
  name: Zero-day mentioned
  weight: 40
  why: A zero-day is being discussed. Without a sale it is usually news, so this is only a weak signal.
  patterns: ['\b0[- ]?day\b', '\bzero[- ]day\b']
- id: DL-EXP-002
  category: exploit_sale
  name: CVE with working exploit
  weight: 70
  why: A CVE number alongside words like RCE or weaponised signals active exploitation interest.
  patterns: ['CVE-\d{4}-\d{4,7}.{0,80}\b(rce|lpe|weaponi[sz]ed|working|exploit|bypass)\b', '\b(rce|lpe|auth bypass)\b.{0,60}CVE-\d{4}-\d{4,7}']
- id: DL-EXP-003
  category: exploit_sale
  name: Initial access broker listing
  weight: 85
  why: Brokers sell footholds (RDP, VPN, shells) into named organisation types before ransomware crews use them.
  # "Initial access" and "VPN access" are ordinary incident-response vocabulary, so every pattern needs sale wording.
  patterns:
    - '\b(selling|sell|for sale|wts|offering|buy)\b.{0,50}\b(rdp|vpn|citrix|webshell|shell|domain admin|network|corporate)\b.{0,40}\baccess\b'
    # Sellers do not always say "selling": a listing, a price or a payment wallet is just as telling.
    - '\b(rdp|vpn|citrix|webshell|domain admin)\b.{0,60}\baccess\b.{0,160}\b(for sale|selling|price|payment|wallet|bitcoin|btc|xmr|monero|escrow|listings?|\$ ?\d)'
    - '\binitial access\b.{0,160}\b(for sale|selling|sell|price|payment|wallet|btc|xmr|escrow|listings?|\$ ?\d)'
    # "Foothold" is the seller's word for access; it needs a price or an escrow next to it.
    - '\bfootholds?\b.{0,100}\b(for sale|selling|btc|xmr|escrow|listings?|\$ ?\d)'
    - '\blistings?\b.{0,60}\b(vpn|rdp|citrix|webshell|shell|domain admin)\b.{0,60}\b(foothold|access)\b'
    - '\b(selling|sell|wts|buying|offering)\b.{0,40}\binitial access\b'
    - '\b(selling|sell|wts|for sale|offering)\b.{0,40}\baccess to\b.{0,50}\b(company|corp|revenue|employees)\b'

- id: DL-PHS-001
  category: phishing_kit
  name: Phishing kit or panel
  weight: 80
  why: Ready-made kits clone login pages and collect victim input.
  patterns: ['\bphishing (kit|page|panel|template)s?\b', '\bscam ?page\b', '\bletter(s)? \+? ?panel\b']
- id: DL-PHS-002
  category: phishing_kit
  name: Brand impersonation
  weight: 60
  why: Kits advertise the brands they clone.
  patterns: ['\b(office ?365|microsoft|paypal|netflix|dhl|amazon|dropbox|icici|hdfc|sbi|paytm)\b.{0,40}\b(kit|page|clone|template|login)\b']
- id: DL-PHS-003
  category: phishing_kit
  name: Evasion features
  weight: 65
  why: Anti-bot and 2FA-bypass features are selling points of modern kits.
  patterns: ['\banti[- ]?bot\b', '\bcloaking\b', '\b(2fa|mfa|otp) (bypass|relay|intercept)\b', '\bevilginx\b|\bmodlishka\b']

- id: DL-MAL-001
  category: malware_sale
  name: Malware or loader for sale
  weight: 80
  why: Commodity malware sold as a service lowers the barrier for attackers.
  patterns: ['\b(rat|loader|crypter|botnet|stealer|rootkit|keylogger)\b.{0,50}\b(for sale|selling|lifetime|subscription|\$\d+|price)\b', '\bfud\b', '\bundetected\b.{0,30}\b(av|antivirus|edr)\b']
- id: DL-MAL-002
  category: malware_sale
  name: EDR evasion claim
  weight: 70
  why: Claims of bypassing endpoint protection indicate offensive tooling aimed at enterprises.
  patterns: ['\b(bypass|evade|kill)\w*\b.{0,30}\b(edr|defender|crowdstrike|sentinelone|antivirus)\b']

- id: DL-FRD-001
  category: carding_fraud
  name: Card data sale
  weight: 75
  why: Stolen payment data is sold in bulk with BIN and country filters.
  # "dumps" alone also means rubbish dumps and database dumps, so a card context is required.
  patterns:
    - '\bfullz\b'
    - '\b(cc|card|credit card)s? dumps?\b'
    - '\bdumps?\b.{0,25}\b(track ?[12]|cvv2?|pin)\b'
    - '\bcvv2?\b.{0,30}\b(sale|selling|fresh|shop|checker)\b'
    - '\b(sale|selling|fresh|shop|checker)\b.{0,30}\bcvv2?\b'
    - '\bbin\b.{0,30}\b(list|country|checker)\b'
    - '\bcc\b.{0,10}\b(shop|checker)\b'
- id: DL-FRD-002
  category: carding_fraud
  name: Cash-out or mule services
  weight: 60
  why: Laundering and mule recruitment are the money end of fraud operations.
  patterns: ['\bcash[- ]?out\b', '\bmules?\b.{0,30}\b(wanted|needed|recruit)', '\bdrops?\b.{0,20}\b(wanted|service|address)\b']

- id: DL-GEN-001
  category: threat_chatter
  name: Targeting statement
  weight: 55
  why: Posts that say who will be attacked are early warning.
  patterns:
    # "Hit our targets" and "target a 10% increase" are business talk, so a verb followed by a number, a goal or a
    # budget does not count.
    - '\b(we|i) (will|are going to|plan to) (attack|hit|target|breach)\b(?!\s+(an? |the |our |my )?(\d|goals?|targets?|numbers?|sales|revenue|quota|deadlines?|budget|market|growth|increase))'
    - '\btarget(ing|s)?\b.{0,30}\b(bank|hospital|government|telecom|retail|energy)\b'
    # Intent plus an attack verb, in the first person or as a group ("our group is going to breach ...").
    - '\b(we|i|our (group|crew|team|collective))\b.{0,30}\b(will|are going to|is going to|plan(ning)? to|are looking to|looking to|intend to)\s+(attack|hit|target|breach|hack|take down|ddos|deface|compromise)\b(?!\s+(an? |the |our |my )?(\d|goals?|targets?|numbers?|sales|revenue|quota|deadlines?|budget|market|growth|increase))'
    - '\b(call to arms|operation announced|hacktivis[mt]s?)\b'
    - '\b(looking|want|planning)\b.{0,15}\bto (hit|breach|hack|attack|target)\b.{0,60}\b(bank|hospital|government|telecom|retail|energy|compan(y|ies)|them)\b'
    - '\banyone (already )?(inside|in|with access to)\b.{0,40}\b(bank|hospital|government|telecom|retail|energy|compan(y|ies))\b'
- id: DL-GEN-002
  category: threat_chatter
  name: Hacktivist campaign
  weight: 45
  why: DDoS and defacement campaigns are announced in advance on channels.
  patterns: ['\b(ddos|defac(e|ement))\b', '#op[a-z]+']
- id: DL-GEN-003
  category: threat_chatter
  name: Cryptocurrency payment instruction
  weight: 35
  why: A payment address next to a threat or sale is a strong monetisation marker.
  patterns: ['\b(send|pay|payment)\b.{0,40}\b(btc|bitcoin|xmr|monero|usdt)\b', '\bwallet\b.{0,15}\b(bc1|1[a-km-zA-HJ-NP-Z1-9]|3[a-km-zA-HJ-NP-Z1-9]|0x)']
- id: DL-GEN-004
  category: threat_chatter
  name: Escrow and trust words
  weight: 25
  why: Escrow and vouch language is common on criminal marketplaces and forums.
  patterns: ['\bescrow\b', '\bvouch(ed|es)?\b', '\btrusted seller\b']
