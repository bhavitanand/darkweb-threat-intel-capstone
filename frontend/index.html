<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101731" />
    <title>DarkLens - What the dark web says about you, in plain English</title>
    <meta name="description" content="DarkLens watches dark web chatter, leaks and ransomware claims, checks them against the domains and emails you care about, and explains every alert in plain language." />
    <meta property="og:title" content="DarkLens - Dark web threat intelligence" />
    <meta property="og:description" content="Scored, explainable alerts about leaks, ransomware claims and exploit sales that concern you." />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <!-- The site routes with the #hash. A shared link such as /alerts would otherwise open the overview, so move the path into the hash. -->
    <script>
      (function () {
        var p = location.pathname;
        if (p !== '/' && !/\.[a-z0-9]+$/i.test(p) && !location.hash) location.replace('/#' + p + location.search);
      })();
    </script>
    <noscript>DarkLens needs JavaScript to show alerts. The source and documentation are on GitHub: github.com/bhavitanand/darkweb-threat-intel-capstone</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
